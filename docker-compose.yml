# ╔══════════════════════════════════════════════════════════════════╗
# ║            CAConnect — Docker Compose (Production)              ║
# ╚══════════════════════════════════════════════════════════════════╝

services:

  # ───────────────────── Infrastructure ─────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: caconnect-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: caconnect-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  # ───────────────── Service Discovery ──────────────────

  eureka:
    build: ./eureka
    container_name: caconnect-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  # ─────────────────── API Gateway ────────────────────

  gateway:
    build: ./gateway
    container_name: caconnect-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  # ──────────────── Backend Services ──────────────────

  user-service:
    build: ./user-service
    container_name: caconnect-user-service
    env_file: .env
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  profile-service:
    build: ./profile-service
    container_name: caconnect-profile-service
    env_file: .env
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  messaging-service:
    build: ./messaging-service
    container_name: caconnect-messaging-service
    env_file: .env
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  location-service:
    build: ./location-service
    container_name: caconnect-location-service
    env_file: .env
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks:
      - caconnect-network

  # ───────────────────── Frontend ─────────────────────

  frontend:
    build: ./frontend/caconnect-ui
    container_name: caconnect-frontend
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - caconnect-network

# ────────────────── Volumes & Networks ──────────────────

volumes:
  pgdata:
    driver: local

networks:
  caconnect-network:
    driver: bridge
